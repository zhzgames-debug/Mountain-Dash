name: Build Mountain Dash APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Mountain Dash project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p extracted
          unzip -q MountainDash_Project.zip -d extracted

      - name: Find Android project
        run: |
          echo "Searching for Gradle wrapper..."
          WRAPPER=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew was not found inside MountainDash_Project.zip"
            echo "Project contents:"
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mountain-Dash-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
